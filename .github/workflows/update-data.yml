name: Update economic data

on:
  schedule:
    # UTC 22:00 = KST 07:00 (매일)
    - cron: "0 22 * * *"
    # GitHub 의 예약 실행은 지연되거나 통째로 건너뛸 수 있어서 예비 슬롯을 하나 더 둔다.
    # UTC 01:00 = KST 10:00. 아래 guard 가 이미 오늘치가 있으면 그냥 건너뛴다.
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # 예비 슬롯이 도는 날에도 하루 한 번만 갱신되도록 막는다.
      # 수동 실행(workflow_dispatch)은 언제든 강제로 돌 수 있어야 하므로 예외로 둔다.
      - name: Skip if already updated today (KST)
        id: guard
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          last=$(node -p "new Date(require('./data/latest.json').generated_at).toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'})" 2>/dev/null || echo none)
          echo "today=$today last=$last event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$today" = "$last" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "오늘($today) 데이터가 이미 있으므로 건너뜁니다."
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch latest economic data
        if: steps.guard.outputs.fresh != 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-data.mjs

      - name: Commit and push if changed
        if: steps.guard.outputs.fresh != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update economic data"
          # 실행 중에 main 이 움직였으면 push 가 거절되므로 먼저 따라붙는다.
          git pull --rebase
          git push

      # 데이터는 위에서 이미 커밋됐다. 다만 일부 섹션이 직전 값으로 때워졌다면
      # 실행을 빨간색으로 남겨서 (= 실패 알림 메일) 조용히 썩는 걸 막는다.
      - name: Fail if any section is stale
        if: steps.guard.outputs.fresh != 'true'
        run: |
          node -e '
            const s = require("./data/latest.json").stale_sections || [];
            if (s.length > 0) {
              console.error("직전 값으로 유지된 섹션: " + s.join(", "));
              process.exit(1);
            }
          '
